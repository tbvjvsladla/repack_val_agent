<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="layers-title layers-desc" font-family="Pretendard, sans-serif" font-size="24" fill="#141413">
  <title id="layers-title">방향·수단·기반을 분리하는 도구 구성</title>
  <desc id="layers-desc">작업수행규칙과 문서발행규칙이라는 두 헌장이 전체 작업의 역할·권한·검증·문서 규칙 경계를 이룬다. 상위 사용자 의도에 따라 메인이 과업별로 각 도구의 사용/미사용·순서·입출력을 정한다. 개선 방향의 harness2는 후보 제안·탐색·대조/조합·선택·회고를 근거로 지원하는 Google Harness² 방법의 독립 구현이며 실제 워커 실행기나 최종 수용자가 아니다. 선택 가능한 수단은 code-review의 신규 결함 검토, rust-repack의 Rust 변환, deepeval-pack의 LLM Judge 평가, pr-review-toolkit의 관점별 검토 및 기타 필요한 독립 도구다. 각 도구는 독립 기동과 명확한 책임을 갖는다. 기반 도구 worker-agent-control은 워커 연결·실행 결과 인수, wiki-desk는 문서 근거 조회·입고를 맡는다. 두 기반 도구는 독립 책임이며 서로 자동 호출하는 관계가 아니다. 세 책임층은 필수 직렬 실행 체인이 아니며 공통 플러그인 API나 활성화 UI가 구현되었다는 뜻도 아니다. 개별 스킬을 헌장이나 자동 엔진으로 표현하지 않는다.</desc>
  <rect width="1100" height="780" fill="#f5f4ed"/>
  <text x="44" y="54" font-size="30" font-weight="700" fill="#1B365D">방향·수단·기반을 분리하는 도구 구성</text>
  <text x="44" y="104" font-size="26" font-weight="600">사용자 의도 → 메인의 선택</text>
  <text x="1056" y="104" text-anchor="end" font-size="22" fill="#504e49">사용/미사용 · 순서 · 입출력 결정</text>
