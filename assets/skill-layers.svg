  <text x="60" y="174" font-size="26" font-weight="700" fill="#1B365D">두 헌장: 작업수행규칙 · 문서발행규칙</text>
  <text x="60" y="212" font-size="22" fill="#504e49">전체 작업의 역할 · 권한 · 검증 · 문서 규칙 경계</text>
  <text x="60" y="280" font-size="26" font-weight="700" fill="#1B365D">개선 방향</text>
  <text x="248" y="280" font-size="28" font-weight="700">harness2</text>
  <text x="435" y="280" font-size="22">후보 제안 · 탐색 · 대조/조합 · 선택 · 회고</text>
  <text x="248" y="323" font-size="23" fill="#504e49">Google Harness² 방법의 독립 구현 · 방향 지원</text>
  <text x="248" y="361" font-size="22" fill="#504e49">워커 실행 · 최종 수용은 별도 책임</text>
