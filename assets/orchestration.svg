  <text x="620" y="608" font-weight="600">repack_target 내부 콘텐츠</text>
  <text x="68" y="651" font-size="22">양쪽 모두: 스킬 · MCP · 플러그인 · 코드베이스</text>
  <text x="1032" y="683" text-anchor="end" font-size="22" fill="#504e49">대상 위치가 달라도 역할 동일</text>
