    <path d="M 194 127 V 177"/>
    <path d="M 344 260 H 402"/>
    <path d="M 678 260 H 734"/>
    <path d="M 906 376 V 432 H 194 V 376"/>
    <path d="M 1010 376 V 510"/>
  </g>
  <text x="64" y="218" font-size="27" font-weight="700" fill="#1B365D">repack_val_agent</text>
  <text x="64" y="256" font-weight="600">메인 · 지휘 세션</text>
  <text x="64" y="300">계획 · 도구 조합</text>
  <text x="64" y="343" fill="#504e49">전체 수용 · 결과 인수</text>
  <text x="540" y="245" text-anchor="middle" font-size="25" font-weight="600" fill="#1B365D">worker-agent-control</text>
  <text x="540" y="287" text-anchor="middle" font-size="22" fill="#504e49">워커 연결 · 실행 인계</text>
  <text x="754" y="218" font-size="27" font-weight="700" fill="#1B365D">대상 워커</text>
  <text x="754" y="256" font-weight="600">별도 실행 세션</text>
  <text x="754" y="300" font-size="22">지침 확인 · 구현 · 자체검사</text>
