<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="740" viewBox="0 0 1100 740" role="img" aria-labelledby="orch-title orch-desc" font-family="Pretendard, sans-serif" font-size="24" fill="#141413">
  <title id="orch-title">지휘와 실행을 나누는 대상 개선</title>
  <desc id="orch-desc">현재 협업 모델의 개요다. 사용자는 목표·허용 범위·완료 기준을 제공한다. repack_val_agent 메인 오케스트레이터는 지휘 세션에서 계획·도구 조합·결과 인수를 맡고 전체 수용 기준으로 최종 판단한다. worker-agent-control 통로로 별도 세션의 대상 워커에 실행을 인계한다. 워커의 workspace는 실제 대상 루트이며 대상 지침 확인·구현·자체검사를 수행한다. 워커는 실제 변경과 실행·검사 근거를 메인에 반환한다. 워커 자체검사와 메인의 전체 수용 판단은 별도 책임이다. 대상은 외부의 기존 프로젝트 또는 repack_target 내부 콘텐츠다. 양쪽 모두 스킬·MCP·플러그인·코드베이스가 될 수 있으며 위치가 역할을 바꾸지 않는다. 최종 결과는 개선된 실제 대상이며 대상 Git은 val_agent와 별도 경계다. 에이전트·세션의 분리를 뜻하며 서로 다른 CLI·모델 종류를 요구하거나 사소한 모든 작업에 강제하는 정책은 아니다.</desc>
  <defs><marker id="orch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#1B365D"/></marker></defs>
  <rect width="1100" height="740" fill="#f5f4ed"/>
