  <text x="844" y="212" font-size="26" font-weight="700" fill="#1B365D">메인 판단 / 회고</text>
  <text x="844" y="257" font-size="22"><tspan x="844" dy="0">채택 · 기준선 유지</tspan><tspan x="844" dy="34">보류</tspan><tspan x="844" dy="34">성공·실패·한계 기록</tspan></text>
