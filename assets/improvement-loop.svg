  <text x="64" y="212" font-size="28" font-weight="700" fill="#1B365D">후보 / 계획</text>
  <text x="64" y="257" font-size="22"><tspan x="64" dy="0">후보를 대조하고</tspan><tspan x="64" dy="36">실행안을 선택</tspan></text>
  <text x="324" y="212" font-size="28" font-weight="700" fill="#1B365D">실행</text>
  <text x="324" y="257" font-size="22"><tspan x="324" dy="0">선택 수단 +</tspan><tspan x="324" dy="36">대상 워커</tspan></text>
  <text x="584" y="212" font-size="28" font-weight="700" fill="#1B365D">검증</text>
