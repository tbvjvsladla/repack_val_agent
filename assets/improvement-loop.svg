  <text x="870" y="612" font-size="26" font-weight="700" fill="#1B365D">다음 과업</text>
  <text x="870" y="651" font-size="22">근거 조회</text>
  <text x="44" y="741" font-size="22" fill="#504e49">과업 기록·생성 위키: 로컬 보존</text>
