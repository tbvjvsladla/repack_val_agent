<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="loop-title loop-desc" font-family="Pretendard, sans-serif" font-size="24" fill="#141413">
  <title id="loop-title">이번 개선의 근거를 다음 개선의 출발점으로</title>
  <desc id="loop-desc">승인된 목표·보존 계약·완료 기준에서 후보와 계획을 정하고 선택 수단과 대상 워커로 실행한다. 실제 결과·필수 검사·기준선 비교로 메인이 채택·기준선 유지·보류를 판단하고 회고한다. 근거가 부족하거나 실패하면 목표·기준을 임의로 낮추지 않고 수정·재실행하거나 보류한다. 회고에는 성공·실패·조건·한계를 남긴다. 하단 기록 띠와 각 단계의 점선은 작업 전반의 문서 작성을 뜻하며 마지막 단계에서만 docs가 생성된다는 뜻이 아니다. 회고와 수행 기록은 docs/interview·docs/plan·docs/devlog·docs/checklist에 반영한다. 각 문서의 역할은 의도·계획 명세·수행·검증이다. 보이는 계획 표기는 plan에 대응한다. wiki-desk는 원문을 가리키는 포인터 위키이며 다음 과업에서 근거를 조회한다. 과업 기록과 생성 위키는 로컬 보존하고 헌장·스킬·작성 가이드는 배포 자산이다. 이 순환은 자동 학습이나 자율 승격을 뜻하지 않는다.</desc>
  <defs>
    <marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#1B365D"/></marker>
    <marker id="loop-record-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#504e49"/></marker>
  </defs>
  <rect width="1100" height="780" fill="#f5f4ed"/>
