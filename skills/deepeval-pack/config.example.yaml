# Copy to config.yaml (local, Git-ignored). Two Judge knobs and the metric list.
# provider: anthropic | openai | google (alias: gemini) | deepseek
# judge_profile: a file name in the project's envs/ folder, e.g. opus_profile.yaml
#   (model and generation settings; see envs/profile.example.yaml). The API key for
#   the provider comes from the process environment or envs/.env.
provider: null
judge_profile: null
metrics:
  - type: ContextualRecallMetric
    params:
      threshold: 0.5
      include_reason: true
  - type: FaithfulnessMetric
    params:
      threshold: 0.5
      include_reason: true
